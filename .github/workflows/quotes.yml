name: quotes

on:
  schedule:
    # cron 은 UTC 기준. KST = UTC+9
    # KST 월~금 08:00~09:00  ->  UTC 일~목 23:00~24:00
    - cron: '*/5 23 * * 0-4'
    # KST 월~금 09:00~16:00  ->  UTC 월~금 00:00~07:00
    - cron: '*/5 0-6 * * 1-5'
    # KST 월~금 06:00~07:59 -> UTC 일~목 21:00~22:59
    # 미국 종가는 20:00 UTC 확정이므로 21:00부터면 안전
    - cron: '*/10 21-22 * * 0-4'
  workflow_dispatch:        # 수동 실행 버튼

# 동시 실행 방지: 늦게 뜬 잡이 먼저 뜬 잡을 덮어쓰는 것을 막는다
concurrency:
  group: quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install --quiet -r requirements.txt

      - name: Fetch quotes
        run: python fetch_quotes.py

      - name: Commit
        run: |
          git config user.name  "quote-bot"
          git config user.email "quote-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "quotes $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # 다른 잡이 먼저 푸시했을 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          exit 1

      # 진단서 §5 의 "쓴 직후 되읽어 epoch 확인" 제안을 실제로 의미 있는 위치로 옮긴 것.
      # 파일을 쓴 직후 되읽는 건 git 이 그걸 담았는지와 무관하다. 확인해야 할 것은
      # '커밋에 들어갔는가'다. 스테이징이 조용히 누락되면 여기서 워크플로가 실패한다.
      - name: Verify latest.json committed
        run: |
          python - <<'PY'
          import json, subprocess, sys
          disk = json.load(open('data/latest.json', encoding='utf-8'))
          head = json.loads(subprocess.check_output(
              ['git', 'show', 'HEAD:data/latest.json'], text=True))
          if head.get('epoch') != disk.get('epoch'):
              sys.exit("data/latest.json 이 커밋에 반영되지 않았다. "
                       f"disk epoch={disk.get('epoch')} / HEAD epoch={head.get('epoch')}. "
                       "조용한 실패를 시끄러운 실패로 바꾸기 위해 여기서 중단한다.")
          print(f"latest.json 커밋 확인 — epoch {head.get('epoch')}, {disk.get('fetched_at_kst')}")
          PY
